<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Lights</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="app">
    <header class="top">
      <h1>My Lights</h1>
      <div class="pill" id="pill" aria-live="polite">
        <span class="dot"></span><span id="pill-text">Checking…</span>
      </div>
    </header>
    <p class="detail" id="detail" aria-live="polite"></p>

    <section class="power-wrap">
      <button class="power" id="power" aria-label="Turn light off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      </button>
      <div class="power-label" id="power-label">On</div>
    </section>

    <section class="glass">
      <h2>Color</h2>
      <div class="swatches">
        <button class="swatch" data-command="WHITE" data-color="white" style="--c:#f5f5f0"><span class="chip"></span><span>White</span></button>
        <button class="swatch" data-command="BLUE" data-color="blue" style="--c:#2f7bff"><span class="chip"></span><span>Blue</span></button>
        <button class="swatch" data-command="GREEN" data-color="green" style="--c:#22c55e"><span class="chip"></span><span>Green</span></button>
        <button class="swatch" data-command="RED" data-color="red" style="--c:#ef4444"><span class="chip"></span><span>Red</span></button>
        <button class="swatch" data-command="PURPLE" data-color="purple" style="--c:#a855f7"><span class="chip"></span><span>Purple</span></button>
      </div>
    </section>

    <section class="glass">
      <div class="row-head">
        <h2>Brightness</h2>
        <span class="level-text" id="level-text">—</span>
      </div>
      <div class="dimmer">
        <button class="step" data-command="DN" aria-label="Dimmer">−</button>
        <div class="meter" id="meter" aria-hidden="true"></div>
        <button class="step" data-command="UP" aria-label="Brighter">+</button>
      </div>
    </section>

    <button class="settings-link" id="open-settings">⚙︎ Connection settings</button>
  </main>

  <dialog id="settings">
    <form method="dialog" class="dialog-head">
      <h2>Connection settings</h2>
      <button class="close" aria-label="Close">×</button>
    </form>
    <label for="api-url">Secure backend URL (HTTPS)</label>
    <input id="api-url" type="url" placeholder="https://my-lights.byronmikesell.workers.dev">
    <label for="api-token">App access token</label>
    <input id="api-token" type="password" placeholder="Enter token supplied during setup" autocomplete="off">
    <p class="hint">These settings are stored on this device. Do not enter Amazon developer secrets here.</p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="clear-settings">Clear</button>
      <button type="button" class="save" id="save-settings">Save settings</button>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
